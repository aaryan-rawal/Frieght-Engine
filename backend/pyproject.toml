[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optifreight-backend"
version = "0.1.0"
description = "OptiFreight AI backend: rules engine, trip planner, ML ranking, API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "shapely>=2.0",
  "pyproj>=3.6",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "tzdata",  # Asia/Kolkata timezone data on Windows
]

[project.optional-dependencies]
# Install with: pip install -e ".[dev]"
dev = [
  "pytest>=8",
  "pytest-cov",
  "hypothesis",
  "ruff",
  "mypy",
  "types-pyyaml",
]
# Install with: pip install -e ".[ml]"  (Models A and B)
ml = [
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "shap>=0.45",
  "joblib",
]
# Model C (neural network): install PyTorch separately using the selector on pytorch.org,
# because the right build depends on your GPU driver and CUDA version.

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["shapely.*", "pyproj.*", "lightgbm.*", "shap.*", "sklearn.*", "argon2.*"]
ignore_missing_imports = true
